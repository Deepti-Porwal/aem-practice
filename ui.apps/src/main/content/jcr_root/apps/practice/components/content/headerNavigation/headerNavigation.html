<sly data-sly-test="${wcmmode.edit}">
    Header Navigation Custom Component
</sly>
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"/>
<sly data-sly-call="${clientlib.css @ categories='practice.headerNavigation'}"/>
<sly data-sly-call="${clientlib.js @ categories='practice.headerNavigation'}"/>
<sly data-sly-use.model="com.adobe.aem.practice.site.core.models.HeaderNavImpl"/>
<!-- Maintenance mode gate — any component can check this -->
<sly data-sly-test="${model.maintenanceMode}">
    <div class="site-maintenance-banner">
        ${model.siteName} is currently undergoing maintenance.
    </div>
</sly>

<header data-sly-test="${!model.maintenanceMode}" class="site-header">

    <!-- Logo — path already CDN-resolved by the service -->
    <a href="/" class="site-logo">
        <img src="${model.logoPath @ context='uri'}"
             alt="${model.siteName @ context='text'}" />
    </a>

    <!-- Site name -->
    <span class="site-name">${model.siteName @ context='text'}</span>

    <!-- Social links — iterated from the parsed map -->
    <nav class="social-links" data-sly-test="${model.socialLinks}">
        <sly data-sly-list.link="${model.socialLinks}">
            <a href="${link.url @ context='uri'}"
               target="_blank"
               rel="noopener noreferrer"
               class="social-link">
                ${link.label @ context='text'}
            </a>
        </sly>
    </nav>

    <!-- GA script — only rendered when ID is configured (publish only) -->
    <sly data-sly-test="${model.googleAnalyticsId}">
        <script async
                src="https://www.googletagmanager.com/gtag/js?id=${model.googleAnalyticsId @ context='uri'}">
        </script>
    </sly>


<button class="cmp-header__toggle">
    ☰
</button>
<nav class="cmp-header">
    <ul class="cmp-header__menu">
        <li data-sly-repeat.item="${model.items}"
            class="${item.active ? 'active' : ''}">
            <a href="${item.path}">
                ${item.title}
            </a>
            <span data-sly-test="${item.children}" class="cmp-header__arrow">
    ▼
</span>
            <ul data-sly-test="${item.children}"
                class="cmp-header__submenu">
                <li data-sly-repeat.child="${item.children}"
                    class="${child.active ? 'active' : ''}">
                    <a href="${child.path}">
                        ${child.title}
                    </a>
                </li>
            </ul>
        </li>
    </ul>
</nav>
<sly data-sly-use.model="com.adobe.aem.practice.site.core.models.PageInfoModel"/>
<h1>Fetching the title and Description of Page using OSGi Service </h1>
<h1>${model.title}</h1>
    <p>${model.description}</p></header>
