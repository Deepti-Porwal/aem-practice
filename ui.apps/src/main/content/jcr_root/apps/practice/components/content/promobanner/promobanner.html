<sly data-sly-test="${wcmmode.edit}">
    Promo Banner Component
</sly>
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"/>
<sly data-sly-call="${clientlib.css @ categories='practice.promobanner'}"/>
<sly data-sly-use.model="com.adobe.aem.practice.site.core.models.PromoBanner"/>

<div class="promo-banner">
    <div class="promo-banner__content">
        <p class="promo-banner__label">${model.promoLabel}</p>
        <a class="promo-banner__cta"
           data-sly-test="${model.ctaLink}"
           href="${model.ctaLink}">
            ${model.ctaText}
        </a>
    </div>
</div>
